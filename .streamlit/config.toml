# Streamlit theme for the Smart Campus AI web UI ("Campus Line", forest & beige).
# Light theme only; ui.py carries the same colours for the custom HTML blocks.

[theme]
base = "light"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
baseRadius = "12px"
buttonRadius = "full"
primaryColor = "#1F4D36"
backgroundColor = "#F6F1E6"
secondaryBackgroundColor = "#F2EBDC"
textColor = "#17251D"
linkColor = "#1F4D36"
borderColor = "#DED2BA"
codeBackgroundColor = "#F2EBDC"

[theme.sidebar]
backgroundColor = "#E3D6BA"
secondaryBackgroundColor = "#FFFCF6"
textColor = "#17251D"
borderColor = "#DED2BA"

[browser]
gatherUsageStats = false
